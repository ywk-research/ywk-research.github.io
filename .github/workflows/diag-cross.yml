name: 점검 (일회성)
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - env: { KRX_API_KEY: "${{ secrets.KRX_API_KEY }}" }
        run: python tools/diag_cross.py
