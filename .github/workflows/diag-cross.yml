name: 점검 (일회성)
on:
  push:
    branches: [claude/project-thread-7xka0z]
    paths: [".github/workflows/diag-cross.yml"]
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - env: { KRX_API_KEY: "${{ secrets.KRX_API_KEY }}" }
        run: python tools/diag_cross.py
# run
