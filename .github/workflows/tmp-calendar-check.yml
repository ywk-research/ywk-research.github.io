name: 임시 캘린더 점검
on:
  push:
    branches: [claude/project-thread-iv38jp]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python tools/fetch_calendar.py
          python -c "import json;[print('EV',e['date'],e['time'],e['s'],e['t']) for e in json.load(open('_data/econ_calendar.json'))['events']]"
          python -c "
          import sys, urllib.request; sys.path.insert(0,'tools'); import fetch_calendar as f
          for s,u in f.SOURCES.items():
              try:
                  print('SUM', s, sorted({e.get('SUMMARY',('',))[0][:90] for e in f.parse_ics(f.get(u))}))
              except urllib.error.HTTPError as e:
                  print('ERR', s, e.code, e.headers.get('Server'), e.read()[:300])
          "
