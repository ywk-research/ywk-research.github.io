name: probe-ecos
on:
  push:
    branches: [claude/project-thread-6r971x]
    paths: [.github/workflows/probe-ecos.yml]
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - env:
          K: ${{ secrets.ECOS_API_KEY }}
        run: |
          K=$(echo "$K" | tr -d ' ')
          for t in 731Y003 731Y002 731Y004; do
            curl -s "https://ecos.bok.or.kr/api/StatisticItemList/$K/json/kr/1/40/$t" | python3 -c "import sys,json;d=json.load(sys.stdin);[print(r['STAT_CODE'],r['ITEM_CODE'],r['ITEM_NAME'],r['CYCLE'],r.get('END_TIME')) for r in d.get('StatisticItemList',{}).get('row',[])] or print(d)"
          done
          curl -s "https://ecos.bok.or.kr/api/StatisticSearch/$K/json/kr/1/10/731Y003/D/20261118/20261124/0000003" | head -c 1500; echo
          curl -s "https://ecos.bok.or.kr/api/StatisticSearch/$K/json/kr/1/10/731Y001/D/20261118/20261124/0000001" | head -c 1500
