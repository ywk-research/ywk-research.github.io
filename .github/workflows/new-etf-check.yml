name: 전 거래일 상장 미국 ETF 확인

# 05:10 "시장 데이터 업데이트"가 올린 후보(_data/new_etf.json, SEC 8-A 기준)를
# Gemini(구글 검색 그라운딩)로 운용사 보도자료·거래소 공지와 대조해 _data/new_etf_confirmed.yml에 전 거래일 D 항목을 쓴다.
# 확인된 것만 싣는다(tools/gemini_etf.py). D 항목이 이미 있으면 아무것도 하지 않는다.
on:
  schedule:
    # 평일 한국시간 05:50, 06:20, 06:35 = UTC 20:50·21:20·21:35 일~목 (앞 실행이 성공하면 뒤는 바로 끝남)
    - cron: "50 20 * * 0-4"
    - cron: "20 21 * * 0-4"
    - cron: "35 21 * * 0-4"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "시험 실행(커밋하지 않고 결과만 로그에)"
        type: boolean
        default: true

permissions:
  contents: write
  pages: write

concurrency:
  group: new-etf-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Gemini로 첫 거래 확인
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python3 tools/gemini_etf.py --dry-run
          else
            python3 tools/gemini_etf.py
          fi

      - name: 커밋
        id: commit
        if: inputs.dry_run != true
        run: |
          git add _data/new_etf_confirmed.yml
          git diff --cached --quiet && exit 0
          d=$(python3 -c "import json;print(json.load(open('_data/new_etf.json'))['us']['prev_day'])")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "전 거래일 상장 ETF 확인 ($d)"
          for i in 1 2 3 4; do
            git pull --rebase && git push && { echo "changed=true" >> "$GITHUB_OUTPUT"; exit 0; }
            sleep $((i * 5))
          done
          exit 1

      - name: Pages 다시 빌드
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages 재빌드 요청 실패"
