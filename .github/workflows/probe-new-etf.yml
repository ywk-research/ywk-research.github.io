name: 임시 점검 - 신규 상장 ETF
on:
  push:
    branches: ['claude/project-thread-gpdo1e']
    paths: ['tools/fetch_new_etf.py', '.github/workflows/probe-new-etf.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          cd tools && python - <<'PY'
          import re, fetch_new_etf as f
          idx = f.sec_get("https://www.sec.gov/Archives/edgar/daily-index/2026/QTR4/form.20261120.idx")
          n = 0
          for line in idx.splitlines():
              if not line.startswith("8-A12B "): continue
              path = re.search(r"(edgar/data/\S+\.txt)", line).group(1)
              txt = f.sec_get("https://www.sec.gov/Archives/" + path)
              head, _, body = txt.partition("</SEC-HEADER>")
              if "STANDARD INDUSTRIAL" in head: continue
              print("=====", path); print(head[:3000])
              t = re.sub(r"<[^>]+>", " ", body); t = re.sub(r"&nbsp;|&#160;|&#xa0;|\s+", " ", t)
              print("----- BODY"); print(t[:2500])
              n += 1
              if n >= 3: break
          PY
