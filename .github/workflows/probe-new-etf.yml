name: 임시 점검 - 신규 상장 ETF
on:
  push:
    branches: ['claude/project-thread-gpdo1e']
    paths: ['tools/fetch_new_etf.py', '.github/workflows/probe-new-etf.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          cd tools && python - <<'PY'
          import re, html, fetch_new_etf as f
          for cik in ["2025968", "1976672"]:
              t = f.sec_get(f"https://www.sec.gov/cgi-bin/browse-edgar?action=getcompany&CIK={cik}&scd=series&count=100")
              t = re.sub(r"\s+", " ", html.unescape(re.sub(r"<[^>]+>", " | ", t or "")))
              print("#####", cik); print(t[:4000])
          PY
