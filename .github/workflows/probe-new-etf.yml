name: 임시 점검 - 신규 상장 ETF
on:
  push:
    branches: ['claude/project-thread-gpdo1e']
    paths: ['tools/fetch_new_etf.py', '.github/workflows/probe-new-etf.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
          NEW_ETF_BACKFILL: "45"
        run: |
          python tools/fetch_new_etf.py
          python -c "import json;d=json.load(open('_data/new_etf.json'));[print('ROW',i['d'],i['ticker'] or '-','|',i['name'],'|',i['issuer'],'|',i['exchange']) for i in d['us']['items']]"
          python -c "import json;print('JSON>'+json.dumps(json.load(open('_data/new_etf.json')),ensure_ascii=False))"
