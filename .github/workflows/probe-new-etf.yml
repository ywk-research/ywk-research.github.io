name: 임시 점검 - 신규 상장 ETF
on:
  push:
    branches: ['claude/project-thread-gpdo1e']
    paths: ['tools/fetch_new_etf.py', '.github/workflows/probe-new-etf.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          DEBUG: "1"
          NEW_ETF_BACKFILL: "12"
        run: |
          python tools/fetch_new_etf.py && cat _data/new_etf.json | head -c 6000
