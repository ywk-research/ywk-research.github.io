name: probe (임시)
on:
  push:
    branches: ['claude/project-thread-jgq9bc']
    paths: ['.github/workflows/probe.yml']
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
        shell: python
        run: |
          import os, json, urllib.request, urllib.parse
          def get(u):
              try:
                  with urllib.request.urlopen(urllib.request.Request(u, headers={"User-Agent": "desk-notes-probe"}), timeout=60) as r:
                      return r.read().decode("utf-8", "replace")
              except Exception as e:
                  return "ERR " + str(e)[:200]
          fk = os.environ["FRED_API_KEY"].strip(); ek = os.environ["ECOS_API_KEY"].strip()
          t = get("https://api.stlouisfed.org/fred/series/search?" + urllib.parse.urlencode({"search_text": "crude oil stocks excluding SPR", "api_key": fk, "file_type": "json", "limit": 15}))
          try:
              for s in json.loads(t)["seriess"]: print(s["id"], "|", s["title"], "|", s["frequency_short"], s["units_short"], s["observation_end"])
          except Exception: print(t[:300])
          for sid in ["WCESTUS1", "WCRSTUS1", "WCSSTUS1"]:
              t = get(f"https://api.stlouisfed.org/fred/series?series_id={sid}&api_key={fk}&file_type=json"); print(sid, t[:200])
          for u in ["https://www.eia.gov/dnav/pet/hist_xls/WCESTUS1w.xls", "https://ir.eia.gov/wpsr/table4.csv", "https://www.eia.gov/dnav/pet/hist/LeafHandler.ashx?n=PET&s=WCESTUS1&f=W"]:
              t = get(u); print(u, len(t), t[:200].replace("\n"," "))
          t = json.loads(get(f"https://ecos.bok.or.kr/api/StatisticItemList/{ek}/json/kr/1/2000/301Y013"))
          for r in t["StatisticItemList"]["row"]:
              if r["CYCLE"] == "M" and any(x in r["ITEM_NAME"] for x in ["증권", "주식", "지분", "부채"]): print(r["ITEM_CODE"], r["ITEM_NAME"], "<-", r.get("P_ITEM_CODE"), r.get("END_TIME"))
