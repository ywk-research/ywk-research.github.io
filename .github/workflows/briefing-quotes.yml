name: 브리핑 전일 종가 받기

# 개장 전 브리핑용 전일 종가(지수·금리·환율·원자재·주요 종목)를 개인용 Worker(desk-pvt /api/close, Yahoo Finance)에서 받아
# _data/briefing_quotes.json에 커밋한다. 미국 장 마감(겨울 06:00, 여름 05:00 KST) 직후에 돈다.
# 06:08 브리핑 예약 작업은 이 파일이 그날 것이 아니면 이 워크플로를 직접 실행하고 기다린다(tools/briefing_task.md).
on:
  schedule:
    # 평일 한국시간 06:02·06:13·06:26·06:41 (UTC 일~목). 예약 실행이 수십 분 늦는 날이 있어(11/26: 06:02 → 06:56)
    # 여러 번 걸어 두고, 이미 오늘 06시 뒤에 받은 파일이 있으면 건너뛴다
    - cron: "2 21 * * 0-4"
    - cron: "13 21 * * 0-4"
    - cron: "26 21 * * 0-4"
    - cron: "41 21 * * 0-4"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: briefing-quotes
  cancel-in-progress: false

jobs:
  quotes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 이미 받았는지 확인
        id: chk
        if: github.event_name == 'schedule'
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, datetime as dt
          kst = dt.timezone(dt.timedelta(hours=9))
          now = dt.datetime.now(kst)
          try:
              u = json.load(open("_data/briefing_quotes.json")).get("updated_at", "")
          except Exception:
              u = ""
          print("skip=" + ("1" if u >= now.strftime("%Y-%m-%d 06:00") else "0"))
          PY
      - name: Worker에서 전일 종가 받기
        if: steps.chk.outputs.skip != '1'
        env:
          DESK_PVT_URL: ${{ secrets.DESK_PVT_URL }}
          DESK_CLOSE_TOKEN: ${{ secrets.DESK_CLOSE_TOKEN }}
        run: python3 tools/fetch_close.py
      - name: 커밋
        run: |
          git add _data/briefing_quotes.json
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "브리핑 전일 종가 ($(TZ=Asia/Seoul date +%Y.%m.%d))"
          for i in 1 2 3 4; do
            git pull --rebase && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
