name: 위젯 심볼 점검 (임시)
on:
  push:
    branches: [claude/project-thread-1vzn6o]
    paths: [".github/workflows/tv-check.yml"]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: npm i playwright@1.47.2 && npx playwright install chromium
      - run: |
          cat > c.js <<'JS'
          const { chromium } = require('playwright');
          (async () => {
            const b = await chromium.launch(); const p = await b.newPage({viewport:{width:1200,height:2000}});
            for (const u of ["https://www.tradingview-widget.com/embed-widget/mini-symbol-overview/?locale=kr&s=INDEX%3ANKY#%7B%22symbol%22%3A%22INDEX%3ANKY%22%2C%22width%22%3A%22100%25%22%2C%22height%22%3A%22100%25%22%2C%22locale%22%3A%22kr%22%2C%22dateRange%22%3A%221M%22%2C%22colorTheme%22%3A%22light%22%2C%22autosize%22%3Atrue%7D", "https://www.tradingview-widget.com/embed-widget/mini-symbol-overview/?locale=kr&s=HSI%3AHSI#%7B%22symbol%22%3A%22HSI%3AHSI%22%2C%22width%22%3A%22100%25%22%2C%22height%22%3A%22100%25%22%2C%22locale%22%3A%22kr%22%2C%22dateRange%22%3A%221M%22%2C%22colorTheme%22%3A%22light%22%2C%22autosize%22%3Atrue%7D", "https://www.tradingview-widget.com/embed-widget/mini-symbol-overview/?locale=kr&s=INDEX%3AHSI#%7B%22symbol%22%3A%22INDEX%3AHSI%22%2C%22width%22%3A%22100%25%22%2C%22height%22%3A%22100%25%22%2C%22locale%22%3A%22kr%22%2C%22dateRange%22%3A%221M%22%2C%22colorTheme%22%3A%22light%22%2C%22autosize%22%3Atrue%7D", "https://www.tradingview-widget.com/embed-widget/mini-symbol-overview/?locale=kr&s=SSE%3A000001#%7B%22symbol%22%3A%22SSE%3A000001%22%2C%22width%22%3A%22100%25%22%2C%22height%22%3A%22100%25%22%2C%22locale%22%3A%22kr%22%2C%22dateRange%22%3A%221M%22%2C%22colorTheme%22%3A%22light%22%2C%22autosize%22%3Atrue%7D", "https://www.tradingview-widget.com/embed-widget/mini-symbol-overview/?locale=kr&s=OSE%3ANK2251%21#%7B%22symbol%22%3A%22OSE%3ANK2251%21%22%2C%22width%22%3A%22100%25%22%2C%22height%22%3A%22100%25%22%2C%22locale%22%3A%22kr%22%2C%22dateRange%22%3A%221M%22%2C%22colorTheme%22%3A%22light%22%2C%22autosize%22%3Atrue%7D", "https://www.tradingview-widget.com/embed-widget/mini-symbol-overview/?locale=kr&s=FOREXCOM%3AJP225#%7B%22symbol%22%3A%22FOREXCOM%3AJP225%22%2C%22width%22%3A%22100%25%22%2C%22height%22%3A%22100%25%22%2C%22locale%22%3A%22kr%22%2C%22dateRange%22%3A%221M%22%2C%22colorTheme%22%3A%22light%22%2C%22autosize%22%3Atrue%7D"]) { await p.goto(u); await p.waitForTimeout(8000); console.log("RES", u.split("&s=")[1].split("#")[0], (await p.innerText("body")).replace(/\n/g," | ")); }
            
            await b.close();
          })();
          JS
          node c.js
