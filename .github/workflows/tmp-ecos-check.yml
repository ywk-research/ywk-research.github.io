name: tmp ecos check
on:
  push:
    branches: [claude/project-thread-ftac6n]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: ECOS 원/달러 종가 조회
        env:
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
        shell: python
        run: |
          import json, os, urllib.request
          k = os.environ["ECOS_API_KEY"].strip()
          def get(path):
              try:
                  with urllib.request.urlopen(f"https://ecos.bok.or.kr/api/{path.replace('KEY', k)}", timeout=40) as r:
                      return json.loads(r.read().decode("utf-8"))
              except Exception as e:
                  return {"ERR": type(e).__name__}
          for t in ["731Y001", "731Y003"]:
              j = get(f"StatisticItemList/KEY/json/kr/1/100/{t}")
              rows = j.get("StatisticItemList", {}).get("row", [])
              print(t, [(r.get("ITEM_CODE"), r.get("ITEM_NAME"), r.get("CYCLE")) for r in rows][:30], j.get("RESULT") or j.get("ERR"))
          for t, item in [("731Y003", "0000003"), ("731Y003", "0000001"), ("731Y003", "0000002")]:
              j = get(f"StatisticSearch/KEY/json/kr/1/100/{t}/D/20261028/20261124/{item}")
              rows = j.get("StatisticSearch", {}).get("row", [])
              print(t, item, rows[0].get("ITEM_NAME1") if rows else j.get("RESULT") or j.get("ERR"))
              print([(r["TIME"], r["DATA_VALUE"]) for r in rows])
