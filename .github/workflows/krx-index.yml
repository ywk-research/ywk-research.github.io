name: 시장 데이터 업데이트

on:
  schedule:
    # 평일 한국시간 08:30, 18:30 (UTC 23:30 일~목, 09:30 월~금)
    - cron: "30 23 * * 0-4"
    - cron: "30 9 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: krx-index
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: KRX 지수 받아오기
        env:
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
        run: python tools/fetch_krx.py

      - name: 해외 지수·금리·원자재·환율 받아오기
        continue-on-error: true
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
        run: python tools/fetch_global.py

      - name: 변경분 커밋
        id: commit
        run: |
          git add _data/
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "KRX 데이터 업데이트"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Pages 다시 빌드
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages 재빌드 요청 실패(다음 푸시 때 반영됩니다)"
