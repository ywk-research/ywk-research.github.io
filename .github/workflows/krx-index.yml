name: 시장 데이터 업데이트

on:
  schedule:
    # 평일 한국시간 07:00, 08:30, 18:30 (UTC 22:00·23:30 일~목, 09:30 월~금)
    # GitHub 예약 실행은 붐비는 시간에 몇 분~수십 분 늦게 시작할 수 있다
    - cron: "0 22 * * 0-4"
    - cron: "30 23 * * 0-4"
    - cron: "30 9 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: krx-index
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # KRX 과거 종가 원본(tools/state/)은 저장소에 커밋하지 않고 Actions 캐시로만 넘긴다(KRX 약관: 제3자 제공 금지).
      # 캐시는 7일 동안 안 쓰면 지워지는데, 그때는 fetch_krx.py가 KRX에서 다시 채운다(약 650회 호출, 10~15분).
      - name: KRX 과거 종가 캐시 불러오기
        uses: actions/cache/restore@v4
        with:
          path: tools/state
          key: krx-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: krx-state-

      - name: KRX 지수·종목 받아오기 (이평선 크로스 포함)
        env:
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
        run: python tools/fetch_krx.py

      - name: KRX 과거 종가 캐시 저장
        if: always() && hashFiles('tools/state/krx_closes/*.json') != ''
        uses: actions/cache/save@v4
        with:
          path: tools/state
          key: krx-state-${{ github.run_id }}-${{ github.run_attempt }}

      - name: 해외 지수·금리·원자재·환율 받아오기
        continue-on-error: true
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
        run: python tools/fetch_global.py

      - name: 미국 지표 발표 일정 받아오기 (BEA)
        continue-on-error: true
        run: python tools/fetch_calendar.py

      - name: 매크로(금리·원화 환율·월간 지표) 받아오기
        continue-on-error: true
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
        run: python tools/fetch_macro.py

      - name: 원자재(EIA 에너지·KRX 금·세계은행 월간) 받아오기
        continue-on-error: true
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
        run: |
          pip install -q openpyxl
          python tools/fetch_commodity.py

      - name: 변경분 커밋
        id: commit
        run: |
          git add _data/
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "KRX 데이터 업데이트"
          git pull --rebase --autostash || true
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Pages 다시 빌드
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages 재빌드 요청 실패(다음 푸시 때 반영됩니다)"
