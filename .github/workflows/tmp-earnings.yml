name: 임시 - 실적발표 일정 첫 수집
on:
  push:
    branches: [claude/project-thread-kq5fml]
    paths: [.github/workflows/tmp-earnings.yml, tools/fetch_earnings.py]
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache/restore@v4
        with:
          path: tools/state
          key: krx-state-none
          restore-keys: krx-state-
      - env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          ls -la tools/state | head
          python tools/fetch_earnings.py
          python - <<'PY'
          import json, collections
          d = json.load(open('_data/earnings.json'))
          ev = d['events']
          print(len(ev), 'names_en', len(d['names_en']), list(d['names_en'].items())[:5])
          for e in ev:
              if e['sym'] in ('AAPL', 'NVDA', '005930', '000660'): print(e)
          print([e for e in ev if e.get('kind') == 'ir'][:15])
          print([e for e in ev if e.get('est')][:10])
          print(collections.Counter(e['date'][:7] for e in ev))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/earnings.json && git commit -m "실적발표 일정 첫 수집" && git push
