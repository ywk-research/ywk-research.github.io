name: tmp probe
on:
  push:
    branches: [claude/project-thread-iv38jp]
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          pip install -q openpyxl
          python tools/fetch_commodity.py
          echo "B64START"; gzip -c _data/commodity.json | base64 -w0; echo; echo "B64END"
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
