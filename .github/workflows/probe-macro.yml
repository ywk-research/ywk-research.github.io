name: probe macro (임시)
on:
  push:
    branches: [claude/project-thread-xwxure]
    paths: [.github/workflows/probe-macro.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - env:
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, re
          k = os.environ["ECOS_API_KEY"].strip()
          def g(u):
              return json.loads(urllib.request.urlopen(urllib.request.Request(u, headers={"User-Agent":"Mozilla/5.0"}), timeout=60).read().decode("utf-8-sig"))
          j = g(f"https://ecos.bok.or.kr/api/StatisticTableList/{k}/json/kr/1/10000")
          for r in j["StatisticTableList"]["row"]:
              if r.get("SRCH_YN") == "Y" and re.search(r"소비자물가|수출입|경상수지|국제수지|실업률|산업생산|광공업|기대인플레", r["STAT_NAME"]):
                  print("T", r["STAT_CODE"], r["CYCLE"], r["STAT_NAME"])
          for t in ["901Y009","901Y010","901Y011","901Y118","301Y013","301Y017","901Y027","901Y033","511Y002"]:
              try:
                  j = g(f"https://ecos.bok.or.kr/api/StatisticItemList/{k}/json/kr/1/80/{t}")
                  for r in j.get("StatisticItemList", {}).get("row", [])[:40]:
                      if r["CYCLE"] == "M": print("I", t, r["ITEM_CODE"], r["ITEM_NAME"], r["GRP_NAME"], r["END_TIME"])
              except Exception as e: print("E", t, e)
          PY
          curl -s "https://home.treasury.gov/resource-center/data-chart-center/interest-rates/daily-treasury-rates.csv/2026/all?type=daily_treasury_real_yield_curve&field_tdr_date_value=2026&page&_format=csv" | head -3
