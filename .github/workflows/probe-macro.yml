name: probe macro (임시)
on:
  push:
    branches: [claude/project-thread-xwxure]
    paths: [.github/workflows/probe-macro.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - env:
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python tools/fetch_macro.py
      - run: |
          ls -la _data/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/ && git commit -m "매크로 확장 데이터 첫 수집" && git push
