name: probe macro (임시)
on:
  push:
    branches: [claude/project-thread-xwxure]
    paths: [.github/workflows/probe-macro.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - env:
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, re
          k = os.environ["ECOS_API_KEY"].strip()
          def g(u):
              return json.loads(urllib.request.urlopen(urllib.request.Request(u, headers={"User-Agent":"Mozilla/5.0"}), timeout=60).read().decode("utf-8-sig"))
          for t in ["901Y010","901Y027","901Y118"]:
              j = g(f"https://ecos.bok.or.kr/api/StatisticItemList/{k}/json/kr/1/300/{t}")
              for r in j.get("StatisticItemList", {}).get("row", []):
                  if r["CYCLE"] == "M" and (t != "901Y010" or "제외" in r["ITEM_NAME"]) and (t != "901Y027" or "률" in r["ITEM_NAME"] or "조정" in r["GRP_NAME"] or r["GRP_NAME"]!="계정항목"): print("I", t, r["ITEM_CODE"], r["ITEM_NAME"], r["GRP_NAME"])
          for t, it in [("901Y009","0"),("901Y118","T002"),("301Y017","SA000"),("511Y002","FME/99988"),("901Y033","A00/2")]:
              j = g(f"https://ecos.bok.or.kr/api/StatisticSearch/{k}/json/kr/1/3/{t}/M/202607/202611/{it}")
              for r in j.get("StatisticSearch", {}).get("row", []): print("S", t, r["TIME"], r["ITEM_NAME1"], r.get("ITEM_NAME2"), r["UNIT_NAME"], r["DATA_VALUE"])
          PY
          curl -s "https://home.treasury.gov/resource-center/data-chart-center/interest-rates/daily-treasury-rates.csv/2026/all?type=daily_treasury_real_yield_curve&field_tdr_date_value=2026&page&_format=csv" | head -3
