name: ECOS 점검(일회성)
on:
  push:
    branches: [claude/project-thread-ajseqq]
    paths: [.github/workflows/ecos-check.yml]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: ECOS 응답 확인
        env:
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
        shell: python
        run: |
          import os, json, urllib.request, datetime as dt
          k = os.environ.get("ECOS_API_KEY", "").strip()
          print("키 있음:", bool(k))
          def g(path):
              with urllib.request.urlopen(f"https://ecos.bok.or.kr/api/{path.replace('KEY', k)}", timeout=40) as r:
                  return json.loads(r.read().decode())
          j = g("StatisticTableList/KEY/json/kr/1/10/731Y001")
          print(json.dumps(j, ensure_ascii=False)[:800])
          j = g("StatisticItemList/KEY/json/kr/1/100/731Y001")
          for r in j.get("StatisticItemList", {}).get("row", [])[:8]:
              print({x: r.get(x) for x in ("ITEM_CODE", "ITEM_NAME", "CYCLE", "START_TIME", "END_TIME", "DATA_CNT", "UNIT_NAME")})
          if "StatisticItemList" not in j: print(json.dumps(j, ensure_ascii=False)[:500])
          e = dt.date.today(); s = e - dt.timedelta(days=10)
          j = g(f"StatisticSearch/KEY/json/kr/1/100/731Y001/D/{s:%Y%m%d}/{e:%Y%m%d}/0000001")
          print(json.dumps(j, ensure_ascii=False)[:2000])
          j = g(f"StatisticSearch/KEY/json/kr/1/100000/731Y001/D/20250101/{e:%Y%m%d}/0000001")
          print("1년+ 건수:", j.get("StatisticSearch", {}).get("list_total_count"), str(j)[:200] if "StatisticSearch" not in j else "")
