name: 임시 ETF 점검
on:
  push:
    branches: [claude/project-thread-iv38jp]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - env:
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
        run: |
          cd tools && python -c "
          import datetime as dt, json, fetch_krx as f, os
          k=os.environ['KRX_API_KEY'].strip(); d=f.last_trading_day(k, dt.datetime.now(f.KST).date()); print('DAY', d); f.update_etf(k, d)
          " ; base64 -w0 ../_data/krx_etf.json 2>/dev/null | sed 's/^/B64 /'
