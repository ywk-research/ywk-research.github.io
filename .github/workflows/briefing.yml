name: 개장 전 브리핑 발간

# 평일 아침 개장 전 브리핑 글을 만들어 main에 올린다.
#  1) tools/make_briefing.py --prune --no-note: _data/의 공식 자료·전일 종가로 숫자 초안(값 없는 줄은 뺌)
#  2) tools/gemini_brief.py: Gemini(구글 검색 그라운딩)로 전일 주요 뉴스·종목 이유 한 줄 채움(검색 출처로 확인 안 된 건 버림)
# 뉴스까지 채우고 미국 지수가 들어가면 filled: true. 아니면 다음 예약 시각에 다시 만들어 덮어쓴다.
# 사용자가 직접 쓴 글(auto: true 없음)이나 이미 filled: true인 글은 건드리지 않는다.
on:
  schedule:
    # 평일 한국시간 06:12, 06:25, 06:40, 07:15 = UTC 21:12·21:25·21:40·22:15 일~목
    # GitHub 예약 실행은 수십 분 늦을 때가 있어 여러 번 걸어 두고, 이미 끝난 날은 바로 건너뛴다
    - cron: "12 21 * * 0-4"
    - cron: "25 21 * * 0-4"
    - cron: "40 21 * * 0-4"
    - cron: "15 22 * * 0-4"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "시험 실행(커밋하지 않고 결과만 로그에)"
        type: boolean
        default: true

permissions:
  contents: write
  pages: write

concurrency:
  group: briefing
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: 오늘 글 상태 확인
        id: chk
        run: |
          f="_posts/$(TZ=Asia/Seoul date +%F)-pre-market-briefing.md"
          echo "file=$f" >> "$GITHUB_OUTPUT"
          run=true
          if [ -f "$f" ]; then
            if ! grep -q '^auto: true' "$f"; then echo "사용자가 쓴 글: $f"; run=false; fi
            if grep -q '^filled: true' "$f"; then echo "이미 완성: $f"; run=false; fi
          fi
          [ "${{ inputs.dry_run }}" = "true" ] && run=true
          echo "run=$run" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        if: steps.chk.outputs.run == 'true'
        with:
          python-version: "3.12"

      - name: 전일 종가(아직 없을 때만)
        if: steps.chk.outputs.run == 'true'
        env:
          DESK_PVT_URL: ${{ secrets.DESK_PVT_URL }}
          DESK_CLOSE_TOKEN: ${{ secrets.DESK_CLOSE_TOKEN }}
        run: |
          u=$(python3 -c "import json;print(json.load(open('_data/briefing_quotes.json')).get('updated_at',''))" 2>/dev/null || true)
          if [[ "$u" < "$(TZ=Asia/Seoul date +%F) 06:00" ]]; then
            python tools/fetch_close.py || echo "전일 종가 못 받음(있는 자료로 진행)"
          else
            echo "오늘 받은 종가 있음 ($u)"
          fi

      - name: 숫자 초안 + Gemini 뉴스·종목 이유
        id: make
        if: steps.chk.outputs.run == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          f="${{ steps.chk.outputs.file }}"
          cp "$f" /tmp/before.md 2>/dev/null || true
          python tools/make_briefing.py --force --prune --no-note | tee /tmp/make.log
          rc=0
          python tools/gemini_brief.py --note-if-empty || rc=$?
          echo "gemini_brief 종료 코드 $rc"
          # 뉴스 3개 이상(rc 0) + 미국 지수(S&P500) 줄이 있으면 완성
          if [ "$rc" = "0" ] && grep -q '^| S&P500 |' "$f"; then
            sed -i '0,/^auto: true$/s//auto: true\nfilled: true/' "$f"
            echo "완성(filled)"
          fi
          echo "------ 결과 ------"; cat "$f"

      - name: 커밋
        id: commit
        if: steps.chk.outputs.run == 'true' && inputs.dry_run != true
        run: |
          f="${{ steps.chk.outputs.file }}"
          git add "$f" _data/briefing_quotes.json
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "개장 전 브리핑 ($(TZ=Asia/Seoul date +%Y.%m.%d))"
          for i in 1 2 3 4; do
            git pull --rebase && git push && { echo "changed=true" >> "$GITHUB_OUTPUT"; exit 0; }
            sleep $((i * 5))
          done
          exit 1

      - name: Pages 다시 빌드
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages 재빌드 요청 실패"
