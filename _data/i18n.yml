# 한/영 전환용 영어 문자열 (헤더 EN 버튼, _layouts/default.html)
# 페이지는 한국어로 빌드되고, 영어 모드일 때만 스크립트가 바꾼다.
#  - en: 템플릿의 data-i18n="키" 요소와 스크립트의 t('키', '한국어')가 쓰는 문장. {이름}은 요소의 data-이름 값으로 채움
#  - names: 데이터 파일(_data/*.json, *.yml)에서 오는 한국어 이름 → 영어. 목록에 없으면 한국어 그대로 보임
# 브리핑 글 본문은 번역하지 않는다(영어 모드에서는 한국어 안내 문구만 보임).

