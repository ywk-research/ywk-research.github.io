  tvcal.note: 'US, Korea, Japan, China and the euro area, medium importance and above. Times follow your device time zone (KST in Korea) · Calendar widget: <a href="https://www.tradingview.com/" rel="noopener nofollow" target="_blank">TradingView</a>'
