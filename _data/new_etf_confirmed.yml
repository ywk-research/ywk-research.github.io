# 전 거래일 상장 미국 ETF 확인 목록 (_includes/new-etf.html 미국 탭 맨 위)
# 날짜(미국 거래일, 따옴표로) 아래에 운용사 보도자료·공지로 그날 첫 거래를 확인한 ETF만 적는다.
#  - checked: true 이면 이 목록만 보여 주고, 없으면 8-A 제출 기준 후보를 "확인 전"으로 보여 준다
#  - 후보(_data/new_etf.json, ld가 그날인 항목)에 없던 ETF도 확인되면 넣어도 된다
#  - src: 확인 근거(운용사 보도자료·공지 URL). 기사 문장은 옮기지 않고 사실(티커·이름·날짜)만 적는다
# 예)
# "2026-11-23":
#   checked: true
#   etfs:
#     - ticker: ABCD
#       name: Example ETF
#       issuer: Example Trust
#       exchange: NYSE Arca
#       src: https://example.com/press-release
