<!-- TradingView 시세표 + 큰 차트 (로고·링크는 약관상 지우지 않음)
     사용: include tv-minis.html id="fx-tv" title="환율" title_key="fx.tv_title" items="FX_IDC:USDKRW|원/달러|USD/KRW;..." range="12M" note="..." note_key="..."
     mode="mini"면 시세표+큰 차트 대신 작은 차트를 2열로 깐다(FX 상단처럼 좌우로 나눠 둘 때).
     items: 심볼|한국어 이름|영어 이름 을 ; 로 이어 쓴다. 위 표에서 값을 한눈에, 아래 차트는 탭으로 종목을 바꿔 본다 -->
{% assign items = include.items | split: ";" %}
<section class="krx gl" id="{{ include.id }}">
  <div class="krx-head">
    <h2{% if include.title_key %} data-i18n="{{ include.title_key }}"{% endif %}>{{ include.title }}</h2>
  </div>
  {% if include.mode == "mini" %}
  <div class="tvm-grid">{% for it in items %}<div class="tvm-card"></div>{% endfor %}</div>
  {% else %}
  <div class="tvo" style="--rows: {{ items.size }}">
    <div class="tvo-quotes"></div>
    <div class="tvo-chart"></div>
  </div>
  {% endif %}
  {% if include.note %}<p class="note"{% if include.note_key %} data-i18n="{{ include.note_key }}"{% endif %}>{{ include.note }}</p>{% endif %}
  <p class="note tvo-credit"><span data-i18n="tv.credit">시세 위젯</span>: <a href="https://kr.tradingview.com/" rel="noopener nofollow" target="_blank">TradingView</a></p>
  <script>
    (function () {
      var root = document.getElementById('{{ include.id }}');
      var ITEMS = [{% for it in items %}{% assign p = it | split: "|" %}[{{ p[0] | strip | jsonify }}, {{ p[1] | strip | jsonify }}, {{ p[2] | strip | jsonify }}]{% unless forloop.last %}, {% endunless %}{% endfor %}];
      function mount(el, type, cfg) {
        el.innerHTML = '';
        var box = document.createElement('div');
        box.className = 'tradingview-widget-container';
        box.innerHTML = '<div class="tradingview-widget-container__widget"></div>';
        var s = document.createElement('script');
        s.src = 'https://s3.tradingview.com/external-embedding/embed-widget-' + type + '.js';
        s.async = true;
        s.text = JSON.stringify(cfg);
        box.appendChild(s);
        el.appendChild(box);
      }
      function render() {
        var th = document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
        var accent = th === 'dark' ? '#7aa2ff' : '#1f4ed8', fill = th === 'dark' ? 'rgba(122,162,255,0.22)' : 'rgba(31,78,216,0.14)';
        var name = function (x) { return LANG === 'en' ? x[2] : x[1]; };
        var minis = root.querySelectorAll('.tvm-card');
        if (minis.length) {
          // 작은 차트: 이름·현재가·등락은 위젯이 크게 보여 준다
          minis.forEach(function (el, i) {
            mount(el, 'mini-symbol-overview', { symbol: ITEMS[i][0], width: '100%', height: '100%', locale: TV_LOCALE,
              dateRange: '{{ include.range | default: "12M" }}', colorTheme: th, isTransparent: true, autosize: true, largeChartUrl: '', chartOnly: false, noTimeScale: false,
              trendLineColor: accent, underLineColor: fill, underLineBottomColor: 'rgba(0,0,0,0)' });
          });
          return;
        }
        mount(root.querySelector('.tvo-quotes'), 'market-quotes', {
          width: '100%', height: '100%', locale: TV_LOCALE, colorTheme: th, isTransparent: true, showSymbolLogo: false,
          symbolsGroups: [{ name: root.querySelector('h2').textContent, symbols: ITEMS.map(function (x) { return { name: x[0], displayName: name(x) }; }) }]
        });
        mount(root.querySelector('.tvo-chart'), 'symbol-overview', {
          symbols: ITEMS.map(function (x) { return [name(x), x[0] + '|{{ include.range | default: "12M" }}']; }),
          chartOnly: false, width: '100%', height: '100%', autosize: true, locale: TV_LOCALE, colorTheme: th, isTransparent: true,
          showVolume: false, showMA: false, hideDateRanges: false, hideMarketStatus: true, hideSymbolLogo: true,
          scalePosition: 'right', scaleMode: 'Normal', fontFamily: 'Pretendard, -apple-system, sans-serif', fontSize: '12',
          noTimeScale: false, valuesTracking: '1', changeMode: 'price-and-percent', chartType: 'area',
          lineWidth: 2, lineType: 0, lineColor: accent, topColor: fill, bottomColor: 'rgba(0,0,0,0)',
          dateRanges: ['1m|30', '3m|60', '12m|1D', '60m|1W', 'all|1M']
        });
      }
      // 탭으로 숨겨진 칸 안이면 보일 때 처음 그린다(숨긴 채로 붙이면 위젯 크기가 0으로 잡힘)
      function go() { if (root.closest('[hidden]')) return false; render(); return true; }
      if (!go()) document.addEventListener('panes-changed', function h() { if (go()) document.removeEventListener('panes-changed', h); });
    })();
  </script>
</section>
