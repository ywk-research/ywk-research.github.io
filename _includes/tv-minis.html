<!-- TradingView 미니 차트 묶음 (로고·링크는 약관상 지우지 않음)
     사용: include tv-minis.html id="fx-tv" title="환율" title_key="fx.tv_title" items="FX_IDC:USDKRW|원/달러|USD/KRW;..." range="12M" note="..." note_key="..."
     items: 심볼|한국어 이름|영어 이름 을 ; 로 이어 쓴다 -->
{% assign items = include.items | split: ";" %}
<section class="krx gl" id="{{ include.id }}">
  <div class="krx-head">
    <h2{% if include.title_key %} data-i18n="{{ include.title_key }}"{% endif %}>{{ include.title }}</h2>
  </div>
  <div class="tv-grid">
    {% for it in items %}{% assign p = it | split: "|" %}
    <div class="tv-card" data-symbol="{{ p[0] | strip }}"><p class="krx-name" data-en="{{ p[2] | strip }}">{{ p[1] | strip }}</p><div class="tv-w"></div></div>
    {% endfor %}
  </div>
  {% if include.note %}<p class="note"{% if include.note_key %} data-i18n="{{ include.note_key }}"{% endif %}>{{ include.note }} · <span data-i18n="tv.credit">시세 위젯</span>: <a href="https://kr.tradingview.com/" rel="noopener nofollow" target="_blank">TradingView</a></p>{% endif %}
  <script>
    (function () {
      var root = document.getElementById('{{ include.id }}');
      var th = document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
      var accent = th === 'dark' ? '#7aa2ff' : '#1f4ed8', fill = th === 'dark' ? 'rgba(122,162,255,0.18)' : 'rgba(31,78,216,0.12)';
      root.querySelectorAll('.tv-card').forEach(function (el) {
        var name = el.querySelector('.krx-name');
        if (LANG === 'en' && name.dataset.en) name.textContent = name.dataset.en;
        var box = document.createElement('div');
        box.className = 'tradingview-widget-container';
        box.innerHTML = '<div class="tradingview-widget-container__widget"></div>';
        var s = document.createElement('script');
        s.src = 'https://s3.tradingview.com/external-embedding/embed-widget-mini-symbol-overview.js';
        s.async = true;
        s.text = JSON.stringify({ symbol: el.dataset.symbol, width: '100%', height: '100%', locale: TV_LOCALE,
          dateRange: '{{ include.range | default: "12M" }}', colorTheme: th, isTransparent: true, autosize: true, largeChartUrl: '',
          trendLineColor: accent, underLineColor: fill, underLineBottomColor: 'rgba(0,0,0,0)' });
        box.appendChild(s);
        el.querySelector('.tv-w').appendChild(box);
      });
    })();
  </script>
</section>
