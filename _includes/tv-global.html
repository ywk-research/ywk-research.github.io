<!-- S&P500 섹터(히트맵·섹터 ETF): TradingView 무료 위젯 (로고·링크는 약관상 지우지 않음)
     해외 지수는 index.html에서 tv-minis.html로 그린다 -->

<section class="krx gl" id="us-sectors">
  <div class="krx-head">
    <h2 data-i18n="sec.title">S&amp;P500 섹터</h2>
  </div>
  <div class="tv-box tv-heat" id="tv-heatmap"></div>
  <p class="note" data-i18n="sec.heat_note">S&amp;P500 종목 히트맵, 섹터별로 묶고 크기는 시가총액, 색은 전일 대비 등락률(지연 시세, 미국식 색: 상승 초록)</p>
  <div class="tv-box" id="tv-sectors"></div>
  <p class="note" data-i18n="sec.note">SPDR 섹터 ETF 11개, 전일 대비 등락 (지연 시세, 미국식 색: 상승 초록) · 시세 위젯: <a href="https://kr.tradingview.com/" rel="noopener nofollow" target="_blank">TradingView</a></p>
</section>
  <script>
    (function () {
      var SECTORS = [
        ['AMEX:XLK', '기술'], ['AMEX:XLC', '커뮤니케이션'], ['AMEX:XLY', '경기소비재'], ['AMEX:XLF', '금융'],
        ['AMEX:XLV', '헬스케어'], ['AMEX:XLI', '산업재'], ['AMEX:XLP', '필수소비재'], ['AMEX:XLE', '에너지'],
        ['AMEX:XLU', '유틸리티'], ['AMEX:XLB', '소재'], ['AMEX:XLRE', '부동산']
      ];
      // 사이트 테마(_layouts/default.html의 data-theme)를 따른다. 기본 다크
      function theme() { return document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark'; }
  
      // 공식 임베드 코드와 같은 구조로 위젯을 붙인다
      function mount(el, type, cfg) {
        el.innerHTML = '';
        var box = document.createElement('div');
        box.className = 'tradingview-widget-container';
        var w = document.createElement('div');
        w.className = 'tradingview-widget-container__widget';
        box.appendChild(w);
        var s = document.createElement('script');
        s.src = 'https://s3.tradingview.com/external-embedding/embed-widget-' + type + '.js';
        s.async = true;
        s.text = JSON.stringify(cfg);
        box.appendChild(s);
        el.appendChild(box);
      }
  
      function render() {
        var th = theme();
        mount(document.getElementById('tv-heatmap'), 'stock-heatmap', {
        dataSource: 'SPX500', exchanges: [], grouping: 'sector', blockSize: 'market_cap_basic',
        blockColor: 'change', locale: TV_LOCALE, symbolUrl: '', colorTheme: th, hasTopBar: false,
        isDataSetEnabled: false, isZoomEnabled: true, hasSymbolTooltip: true, isMonoSize: false,
        isTransparent: true, width: '100%', height: '100%'
      });
      mount(document.getElementById('tv-sectors'), 'market-quotes', {
          width: '100%', height: '100%', locale: TV_LOCALE, colorTheme: th, isTransparent: true, showSymbolLogo: false,
          symbolsGroups: [{ name: t('sec.group', '섹터 ETF'), symbols: SECTORS.map(function (x) { return { name: x[0], displayName: tn(x[1]) + ' · ' + x[0].split(':')[1] }; }) }]
        });
      }
  
      // 시장 탭 등으로 숨겨진 칸 안에 있으면, 보일 때 처음 그린다(숨긴 채로 붙이면 위젯 크기가 0으로 잡힘)
      var sec = document.currentScript && document.currentScript.previousElementSibling;
      function go() { if (sec && sec.closest('[hidden]')) return false; render(); return true; }
      if (!go()) document.addEventListener('panes-changed', function h() { if (go()) document.removeEventListener('panes-changed', h); });
    })();
  </script>
