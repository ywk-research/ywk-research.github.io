<!-- 경제 캘린더: TradingView 무료 위젯 (로고·링크는 약관상 지우지 않음) -->
<section class="tv-cal" id="econ-calendar">
  <h2>경제 캘린더</h2>
  <div class="tv-box tv-cal-box" id="tv-calendar"></div>
  <p class="note">미국·한국·일본·중국·유로존, 중요도 중간 이상. 시간은 보는 기기의 시간대 기준(한국에서는 한국시간) · 캘린더 위젯: <a href="https://kr.tradingview.com/" rel="noopener nofollow" target="_blank">TradingView</a></p>
  <script>
    (function () {
      var t = document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
      var box = document.createElement('div');
      box.className = 'tradingview-widget-container';
      box.innerHTML = '<div class="tradingview-widget-container__widget"></div>';
      var s = document.createElement('script');
      s.src = 'https://s3.tradingview.com/external-embedding/embed-widget-events.js';
      s.async = true;
      s.text = JSON.stringify({ colorTheme: t, isTransparent: true, locale: 'kr',
        countryFilter: 'us,kr,jp,cn,eu', importanceFilter: '0,1', width: '100%', height: '100%' });
      box.appendChild(s);
      document.getElementById('tv-calendar').appendChild(box);
    })();
  </script>
</section>
