<!-- 월간 경제 일정 달력: 중앙은행 회의(_data/econ_events.yml, 손으로 관리) + 미국 지표 발표(_data/econ_calendar.json, BLS·BEA 공식 .ics 자동 수집) -->
<section class="ecal" id="econ-month">
  <div class="krx-head">
    <h2 data-i18n="ecal.title">경제 일정</h2>
    <div class="ecal-nav">
      <button type="button" data-step="-1" aria-label="이전 달" data-i18n-aria="ecal.prev">‹</button>
      <span class="ecal-title"></span>
      <button type="button" data-step="1" aria-label="다음 달" data-i18n-aria="ecal.next">›</button>
      <button type="button" data-step="0" class="ecal-today" data-i18n="ecal.today">오늘</button>
    </div>
  </div>
  <div class="ecal-grid" role="grid"></div>
  <div class="ecal-day" aria-live="polite"></div>
  <p class="note" data-i18n="ecal.note">한국시간 기준. 각국 정부·중앙은행·통계기관이 공개한 공식 발표 일정만 넣었어요(미 BLS·BEA·인구조사국·노동부, ISM, 연준·ECB, 한국은행·국가데이터처·산업통상부, 일본은행·총무성·내각부, 중국 국가통계국). 한국·중국 2027년 지표 일정은 기관이 공개하면 추가해요. 회색 작은 글씨는 매주 나오는 일정이에요.</p>
  <script>
    (function () {
      var manual = {{ site.data.econ_events | jsonify }} || [];
      var auto = ({{ site.data.econ_calendar | jsonify }} || {}).events || [];
      // 국기: 윈도우는 국기 이모지를 글자(US·KR)로 보여 줘서 작은 SVG로 그린다
      var FLAG = {"us": "<svg class=\"flag\" viewBox=\"0 0 24 16\" width=\"18\" height=\"12\" role=\"img\" aria-label=\"US\"><rect width=\"24\" height=\"16\" fill=\"#fff\"/><rect y=\"0.00\" width=\"24\" height=\"1.23\" fill=\"#b22234\"/><rect y=\"2.46\" width=\"24\" height=\"1.23\" fill=\"#b22234\"/><rect y=\"4.92\" width=\"24\" height=\"1.23\" fill=\"#b22234\"/><rect y=\"7.38\" width=\"24\" height=\"1.23\" fill=\"#b22234\"/><rect y=\"9.85\" width=\"24\" height=\"1.23\" fill=\"#b22234\"/><rect y=\"12.31\" width=\"24\" height=\"1.23\" fill=\"#b22234\"/><rect y=\"14.77\" width=\"24\" height=\"1.23\" fill=\"#b22234\"/><rect width=\"10\" height=\"8.62\" fill=\"#3c3b6e\"/><rect x=\".25\" y=\".25\" width=\"23.5\" height=\"15.5\" fill=\"none\" stroke=\"rgba(127,127,127,.45)\" stroke-width=\".5\"/></svg>", "kr": "<svg class=\"flag\" viewBox=\"0 0 24 16\" width=\"18\" height=\"12\" role=\"img\" aria-label=\"KR\"><rect width=\"24\" height=\"16\" fill=\"#fff\"/><path d=\"M8 8a4 4 0 0 1 8 0z\" fill=\"#cd2e3a\"/><path d=\"M8 8a4 4 0 0 0 8 0z\" fill=\"#0047a0\"/><path d=\"M3 3.5l2.5-1.5M3.6 4.4l2.5-1.5M18.5 2l2.5 1.5M17.9 2.9l2.5 1.5M3 12.5l2.5 1.5M3.6 11.6l2.5 1.5M18.5 14l2.5-1.5M17.9 13.1l2.5-1.5\" stroke=\"#000\" stroke-width=\".6\"/><rect x=\".25\" y=\".25\" width=\"23.5\" height=\"15.5\" fill=\"none\" stroke=\"rgba(127,127,127,.45)\" stroke-width=\".5\"/></svg>", "jp": "<svg class=\"flag\" viewBox=\"0 0 24 16\" width=\"18\" height=\"12\" role=\"img\" aria-label=\"JP\"><rect width=\"24\" height=\"16\" fill=\"#fff\"/><circle cx=\"12\" cy=\"8\" r=\"4.8\" fill=\"#bc002d\"/><rect x=\".25\" y=\".25\" width=\"23.5\" height=\"15.5\" fill=\"none\" stroke=\"rgba(127,127,127,.45)\" stroke-width=\".5\"/></svg>", "cn": "<svg class=\"flag\" viewBox=\"0 0 24 16\" width=\"18\" height=\"12\" role=\"img\" aria-label=\"CN\"><rect width=\"24\" height=\"16\" fill=\"#de2910\"/><polygon points=\"4.50,1.70 5.16,3.59 7.16,3.63 5.57,4.85 6.15,6.77 4.50,5.62 2.85,6.77 3.43,4.85 1.84,3.63 3.84,3.59\" fill=\"#ffde00\"/><polygon points=\"9.00,0.90 9.21,1.51 9.86,1.52 9.34,1.91 9.53,2.53 9.00,2.16 8.47,2.53 8.66,1.91 8.14,1.52 8.79,1.51\" fill=\"#ffde00\"/><polygon points=\"10.60,2.70 10.81,3.31 11.46,3.32 10.94,3.71 11.13,4.33 10.60,3.96 10.07,4.33 10.26,3.71 9.74,3.32 10.39,3.31\" fill=\"#ffde00\"/><polygon points=\"10.60,5.30 10.81,5.91 11.46,5.92 10.94,6.31 11.13,6.93 10.60,6.56 10.07,6.93 10.26,6.31 9.74,5.92 10.39,5.91\" fill=\"#ffde00\"/><polygon points=\"9.00,7.10 9.21,7.71 9.86,7.72 9.34,8.11 9.53,8.73 9.00,8.36 8.47,8.73 8.66,8.11 8.14,7.72 8.79,7.71\" fill=\"#ffde00\"/><rect x=\".25\" y=\".25\" width=\"23.5\" height=\"15.5\" fill=\"none\" stroke=\"rgba(127,127,127,.45)\" stroke-width=\".5\"/></svg>", "eu": "<svg class=\"flag\" viewBox=\"0 0 24 16\" width=\"18\" height=\"12\" role=\"img\" aria-label=\"EU\"><rect width=\"24\" height=\"16\" fill=\"#003399\"/><circle cx=\"17.00\" cy=\"8.00\" r=\".75\" fill=\"#fc0\"/><circle cx=\"16.33\" cy=\"10.50\" r=\".75\" fill=\"#fc0\"/><circle cx=\"14.50\" cy=\"12.33\" r=\".75\" fill=\"#fc0\"/><circle cx=\"12.00\" cy=\"13.00\" r=\".75\" fill=\"#fc0\"/><circle cx=\"9.50\" cy=\"12.33\" r=\".75\" fill=\"#fc0\"/><circle cx=\"7.67\" cy=\"10.50\" r=\".75\" fill=\"#fc0\"/><circle cx=\"7.00\" cy=\"8.00\" r=\".75\" fill=\"#fc0\"/><circle cx=\"7.67\" cy=\"5.50\" r=\".75\" fill=\"#fc0\"/><circle cx=\"9.50\" cy=\"3.67\" r=\".75\" fill=\"#fc0\"/><circle cx=\"12.00\" cy=\"3.00\" r=\".75\" fill=\"#fc0\"/><circle cx=\"14.50\" cy=\"3.67\" r=\".75\" fill=\"#fc0\"/><circle cx=\"16.33\" cy=\"5.50\" r=\".75\" fill=\"#fc0\"/><rect x=\".25\" y=\".25\" width=\"23.5\" height=\"15.5\" fill=\"none\" stroke=\"rgba(127,127,127,.45)\" stroke-width=\".5\"/></svg>"};
      var EN = LANG === 'en';
      var WD = EN ? ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'] : ['일', '월', '화', '수', '목', '금', '토'];
      var MON = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
      var byDate = {};
      manual.concat(auto).forEach(function (e) { (byDate[e.date] = byDate[e.date] || []).push(e); });
      Object.keys(byDate).forEach(function (d) {
        byDate[d].sort(function (a, b) { return (a.time || '99').localeCompare(b.time || '99'); });
      });

      function pad(n) { return (n < 10 ? '0' : '') + n; }
      function key(y, m, d) { return y + '-' + pad(m + 1) + '-' + pad(d); }
      // 오늘(한국시간)
      var now = new Date(Date.now() + (9 * 60 + new Date().getTimezoneOffset()) * 60000);
      var today = key(now.getFullYear(), now.getMonth(), now.getDate());
      var cur = { y: now.getFullYear(), m: now.getMonth() }, sel = today;

      var root = document.getElementById('econ-month');
      var grid = root.querySelector('.ecal-grid'), title = root.querySelector('.ecal-title'), day = root.querySelector('.ecal-day');

      function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

      function showDay(k) {
        sel = k;
        grid.querySelectorAll('.ecal-cell').forEach(function (c) { c.classList.toggle('sel', c.dataset.d === k); });
        var p = k.split('-'), wd = WD[new Date(+p[0], +p[1] - 1, +p[2]).getDay()];
        var list = byDate[k] || [];
        day.innerHTML = '<h3>' + (EN ? wd + ', ' + MON[+p[1] - 1].slice(0, 3) + ' ' + (+p[2]) : (+p[1]) + '월 ' + (+p[2]) + '일 (' + wd + ')') + '</h3>' + (list.length
          ? '<ul>' + list.map(function (e) {
              return '<li' + (e.minor ? ' class="minor"' : '') + '><span class="ecal-time">' + (e.time || '—') + '</span><span class="ecal-flag">' + (FLAG[e.c] || '') + '</span>' + esc(tn(e.t)) + '</li>';
            }).join('') + '</ul>'
          : '<p class="ecal-empty">' + t('ecal.empty', '주요 일정이 없어요.') + '</p>');
      }

      // 칸에는 주요 일정 먼저 최대 MAX개, 나머지는 +n. 매주 나오는 일정(minor)은 회색으로 작게
      var MAX = 4;
      function evHtml(list) {
        var major = list.filter(function (e) { return !e.minor; }), minor = list.filter(function (e) { return e.minor; });
        var shown = major.concat(minor).slice(0, MAX), rest = list.length - shown.length;
        return shown.map(function (e) {
          return '<span class="ecal-ev ' + e.c + (e.minor ? ' minor' : '') + '">' + (FLAG[e.c] || '') + '<b>' + esc(tn(e.s || e.t)) + '</b></span>';
        }).join('') + (rest > 0 ? '<span class="ecal-more">+' + rest + '</span>' : '');
      }

      function render() {
        var y = cur.y, m = cur.m;
        title.textContent = EN ? MON[m] + ' ' + y : y + '년 ' + (m + 1) + '월';
        var first = new Date(y, m, 1).getDay(), days = new Date(y, m + 1, 0).getDate();
        var html = WD.map(function (w, i) { return '<div class="ecal-wd' + (i === 0 ? ' sun' : i === 6 ? ' sat' : '') + '">' + w + '</div>'; }).join('');
        for (var i = 0; i < first; i++) html += '<div class="ecal-cell blank"></div>';
        for (var d = 1; d <= days; d++) {
          var k = key(y, m, d), list = byDate[k] || [], wd = (first + d - 1) % 7;
          html += '<button type="button" class="ecal-cell' + (k === today ? ' today' : '') + (wd === 0 ? ' sun' : wd === 6 ? ' sat' : '') + '" data-d="' + k + '">' +
            '<span class="ecal-num">' + d + '</span>' +
            evHtml(list) +
            '</button>';
        }
        grid.innerHTML = html;
        grid.querySelectorAll('.ecal-cell[data-d]').forEach(function (c) { c.addEventListener('click', function () { showDay(c.dataset.d); }); });
        var p = sel.split('-');
        showDay(+p[0] === y && +p[1] === m + 1 ? sel : key(y, m, 1));
      }

      root.querySelectorAll('.ecal-nav button').forEach(function (b) {
        b.addEventListener('click', function () {
          var s = +b.dataset.step;
          if (s === 0) { cur = { y: now.getFullYear(), m: now.getMonth() }; sel = today; }
          else { var t = new Date(cur.y, cur.m + s, 1); cur = { y: t.getFullYear(), m: t.getMonth() }; }
          render();
        });
      });
      render();
    })();
  </script>
</section>
