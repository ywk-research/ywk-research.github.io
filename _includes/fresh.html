<!-- 시세 기준 표시. kind: live(실시간 위젯) | close(그날 종가) | asof(주간·월간·공시 등 기준일). d: YYYY-MM-DD 또는 YYYY-MM
     글자는 _layouts/default.html의 스크립트가 언어에 맞춰 채운다 -->
<span class="fresh fresh-{{ include.kind }}" data-kind="{{ include.kind }}"{% if include.d %} data-d="{{ include.d | slice: 0, 10 }}"{% endif %}></span>
