<!DOCTYPE html>
<html lang="{{ site.lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    // 기본은 다크. 방문자가 고른 테마가 있으면 그걸 쓴다
    (function () {
      var t = 'dark';
      try { t = localStorage.getItem('theme') === 'light' ? 'light' : 'dark'; } catch (e) {}
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}?v={{ site.time | date: '%s' }}">
</head>
<body>
  <header class="site-header">
    <div class="wrap head-top{% if page.wide %} wide{% endif %}">
      <a class="brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
      <button type="button" class="theme-toggle" id="theme-toggle" aria-label="라이트/다크 전환"></button>
    </div>
    <nav class="site-nav" aria-label="메뉴">
      <a href="{{ '/' | relative_url }}"{% if page.url == '/' or page.url contains '/briefing/' %} class="on" aria-current="page"{% endif %}>브리핑</a>
      <a href="{{ '/data/' | relative_url }}"{% if page.url contains '/data/' %} class="on" aria-current="page"{% endif %}>데이터</a>
      <a href="{{ '/watchlist/' | relative_url }}"{% if page.url contains '/watchlist/' %} class="on" aria-current="page"{% endif %}>관심종목</a>
      <a href="{{ '/about/' | relative_url }}"{% if page.url contains '/about/' %} class="on" aria-current="page"{% endif %}>소개</a>
    </nav>
  </header>

  <main class="wrap{% if page.wide %} wide{% endif %}">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="wrap{% if page.wide %} wide{% endif %}">
      <p>공개 자료를 정리한 정보 제공 목적의 글이며, 투자 권유가 아닙니다. 투자 판단과 그 결과의 책임은 투자자 본인에게 있습니다.</p>
      <p>© {{ site.time | date: "%Y" }} {{ site.title }}</p>
    </div>
  </footer>
  <script>
    (function () {
      var b = document.getElementById('theme-toggle'), root = document.documentElement;
      function label() { var d = root.getAttribute('data-theme') === 'dark'; b.textContent = d ? '☀️' : '🌙'; b.title = d ? '라이트 모드로' : '다크 모드로'; }
      label();
      b.addEventListener('click', function () {
        var t = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        try { localStorage.setItem('theme', t); } catch (e) {}
        root.setAttribute('data-theme', t);
        location.reload(); // 차트·위젯 색을 새 테마로 다시 그린다
      });
    })();
  </script>
</body>
</html>
