<!DOCTYPE html>
<html lang="{{ site.lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    // 기본은 다크. 방문자가 고른 테마가 있으면 그걸 쓴다
    (function () {
      var t = 'dark';
      try { t = localStorage.getItem('theme') === 'light' ? 'light' : 'dark'; } catch (e) {}
      document.documentElement.setAttribute('data-theme', t);
    })();
    // 언어: 기본 한국어. 영어를 고르면 data-lang="en"이 붙고, 아래 끝부분 스크립트가 문구를 바꾼다
    // 각 include의 스크립트는 LANG, t('키', '한국어'), tn('한국어 이름'), TV_LOCALE을 쓴다
    (function () {
      var l = 'ko';
      try { l = localStorage.getItem('lang') === 'en' ? 'en' : 'ko'; } catch (e) {}
      var root = document.documentElement, D = {{ site.data.i18n | jsonify }} || {};
      var EN = D.en || {}, NAMES = D.names || {};
      root.setAttribute('data-lang', l);
      root.lang = l;
      window.LANG = l;
      window.TV_LOCALE = l === 'en' ? 'en' : 'kr';
      // 영어 모드면 en 문장({이름}은 vars로 채움), 아니면 넘겨받은 한국어
      window.t = function (key, ko, vars) {
        var s = l === 'en' && EN[key] != null ? String(EN[key]) : ko;
        return s == null ? key : String(s).replace(/\{(\w+)\}/g, function (m, k) { return vars && vars[k] != null ? vars[k] : m; });
      };
      // 데이터에서 온 한국어 이름. 쉼표로 이어진 목록은 하나씩 바꾼다
      window.tn = function (ko) {
        if (l !== 'en' || ko == null) return ko;
        ko = String(ko);
        if (NAMES[ko] != null) return NAMES[ko];
        return ko.indexOf(', ') > 0 ? ko.split(', ').map(function (x) { return NAMES[x] != null ? NAMES[x] : x; }).join(', ') : ko;
      };
    })();
  </script>
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}?v={{ site.time | date: '%s' }}">
</head>
<body>
  <header class="site-header">
    <div class="wrap head-top{% if page.wide %} wide{% endif %}">
      <a class="brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
      <span class="head-tools">
        <button type="button" class="theme-toggle lang-toggle" id="lang-toggle"></button>
        <button type="button" class="theme-toggle" id="theme-toggle" aria-label="라이트/다크 전환" data-i18n-aria="theme.aria"></button>
      </span>
    </div>
    <nav class="site-nav" aria-label="메뉴" data-i18n-aria="nav.aria">
      <a href="{{ '/' | relative_url }}"{% if page.url == '/' or page.url contains '/briefing/' %} class="on" aria-current="page"{% endif %} data-i18n="nav.briefing">브리핑</a>
      <a href="{{ '/data/' | relative_url }}"{% if page.url contains '/data/' %} class="on" aria-current="page"{% endif %} data-i18n="nav.data">데이터</a>
      <a href="{{ '/macro/' | relative_url }}"{% if page.url contains '/macro/' %} class="on" aria-current="page"{% endif %} data-i18n="nav.macro">매크로</a>
      <a href="{{ '/watchlist/' | relative_url }}"{% if page.url contains '/watchlist/' %} class="on" aria-current="page"{% endif %} data-i18n="nav.watchlist">관심종목</a>
      <a href="{{ '/about/' | relative_url }}"{% if page.url contains '/about/' %} class="on" aria-current="page"{% endif %} data-i18n="nav.about">소개</a>
    </nav>
  </header>

  <main class="wrap{% if page.wide %} wide{% endif %}">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="wrap{% if page.wide %} wide{% endif %}">
      <p data-i18n="footer.disclaimer">공개 자료를 정리한 정보 제공 목적의 글이며, 투자 권유가 아닙니다. 투자 판단과 그 결과의 책임은 투자자 본인에게 있습니다.</p>
      <p>© {{ site.time | date: "%Y" }} {{ site.title }}</p>
    </div>
  </footer>
  <script>
    (function () {
      var b = document.getElementById('theme-toggle'), root = document.documentElement;
      function label() { var d = root.getAttribute('data-theme') === 'dark'; b.textContent = d ? '☀️' : '🌙'; b.title = d ? t('theme.to_light', '라이트 모드로') : t('theme.to_dark', '다크 모드로'); }
      label();
      b.addEventListener('click', function () {
        var nt = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        try { localStorage.setItem('theme', nt); } catch (e) {}
        root.setAttribute('data-theme', nt);
        location.reload(); // 차트·위젯 색을 새 테마로 다시 그린다
      });
    })();
  </script>
  <script>
    // 한/영 전환. 누르면 새로고침해서 차트·위젯도 새 언어로 다시 그린다
    (function () {
      var b = document.getElementById('lang-toggle');
      b.textContent = LANG === 'en' ? '한' : 'EN';
      b.title = LANG === 'en' ? '한국어로 보기' : 'View in English';
      b.setAttribute('aria-label', b.title);
      b.setAttribute('lang', LANG === 'en' ? 'ko' : 'en');
      b.addEventListener('click', function () {
        try { localStorage.setItem('lang', LANG === 'en' ? 'ko' : 'en'); } catch (e) {}
        location.reload();
      });
      if (LANG !== 'en') return;
      // data-i18n="키": en 문장으로 교체(링크 등 HTML 허용). {이름}은 요소의 data-이름 값(데이터 이름이면 영어로)
      document.querySelectorAll('[data-i18n]').forEach(function (el) {
        var vars = {};
        Object.keys(el.dataset).forEach(function (k) { vars[k] = tn(el.dataset[k]); });
        var s = t(el.dataset.i18n, null, vars);
        if (s != null && s !== el.dataset.i18n) el.innerHTML = s;
      });
      // data-en="영어": Liquid가 미리 만든 영어(날짜 등)로 글자만 교체
      document.querySelectorAll('[data-en]').forEach(function (el) { el.textContent = el.dataset.en; });
      // data-i18n-name: 데이터에서 온 한국어 이름
      document.querySelectorAll('[data-i18n-name]').forEach(function (el) { el.textContent = tn(el.textContent.trim()); });
      document.querySelectorAll('[data-i18n-aria]').forEach(function (el) { el.setAttribute('aria-label', t(el.dataset.i18nAria, el.getAttribute('aria-label'))); });
      {% if page.title_en %}document.title = {{ page.title_en | append: ' · ' | append: site.title | jsonify }};{% endif %}
    })();
  </script>
</body>
</html>
